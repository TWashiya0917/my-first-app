<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポモドーロタイマー</title>
<style>
  :root {
    --focus-color: #e63946;
    --break-color: #2a9d8f;
    --bg-color: #1d1f27;
    --card-color: #262933;
    --text-color: #f1f1f1;
    --muted-color: #9a9ca5;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-color);
    color: var(--text-color);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    transition: background 0.4s ease;
  }

  body.break-mode {
    background: #17262a;
  }

  .card {
    background: var(--card-color);
    border-radius: 24px;
    padding: 48px 56px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    width: 380px;
    max-width: 90vw;
  }

  .mode-label {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    background: var(--focus-color);
    color: white;
    margin-bottom: 24px;
    transition: background 0.4s ease;
  }

  .mode-label.break {
    background: var(--break-color);
  }

  .time-display {
    font-size: 88px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    margin: 8px 0 8px;
  }

  .cycle-count {
    color: var(--muted-color);
    font-size: 14px;
    margin-bottom: 24px;
  }

  .settings {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 28px;
  }

  .setting-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .setting-item label {
    font-size: 12px;
    color: var(--muted-color);
  }

  .setting-item select {
    width: 100px;
    padding: 8px 4px;
    text-align: center;
    text-align-last: center;
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    border-radius: 8px;
    border: 1px solid #3a3d47;
    background: #1d1f27;
    color: var(--text-color);
  }

  .setting-item select:disabled {
    opacity: 0.5;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .buttons-row {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  #alarmStopBtn {
    background: #f4a300;
    color: #1d1f27;
  }

  #alarmStopBtn:disabled {
    background: #3a3d47;
    color: var(--muted-color);
  }

  #alarmStopBtn.ringing {
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  button {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }

  button:active {
    transform: scale(0.96);
  }

  #startStopBtn {
    background: var(--focus-color);
    color: white;
  }

  body.break-mode #startStopBtn {
    background: var(--break-color);
  }

  #resetBtn {
    background: #3a3d47;
    color: var(--text-color);
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  /* スマートフォンなど幅の狭い画面向けの調整 */
  @media (max-width: 420px) {
    body {
      padding: 16px;
    }

    .card {
      width: 100%;
      padding: 32px 20px;
    }

    .time-display {
      font-size: 15vw;
    }

    .settings {
      gap: 12px;
    }

    .setting-item select {
      width: 90px;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="mode-label" id="modeLabel">集中モード</div>
  <div class="time-display" id="timeDisplay">25:00</div>
  <div class="cycle-count" id="cycleCount">完了したセット: 0</div>
  <div class="settings">
    <div class="setting-item">
      <label for="focusSelect">集中時間</label>
      <select id="focusSelect"></select>
    </div>
    <div class="setting-item">
      <label for="breakSelect">休憩時間</label>
      <select id="breakSelect"></select>
    </div>
  </div>
  <div class="buttons">
    <div class="buttons-row">
      <button id="startStopBtn">開始</button>
      <button id="resetBtn">リセット</button>
    </div>
    <button id="alarmStopBtn" disabled>アラーム停止</button>
  </div>
</div>

<script>
  const STEP_SECONDS = 15;
  const FOCUS_MAX_SECONDS = 60 * 60; // 集中時間の上限：60分
  const BREAK_MAX_SECONDS = 30 * 60; // 休憩時間の上限：30分

  const focusSelect = document.getElementById('focusSelect');
  const breakSelect = document.getElementById('breakSelect');

  function formatTime(totalSeconds) {
    const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
    const s = (totalSeconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  // 15秒刻みのプルダウンを生成する
  function populateTimeSelect(select, maxSeconds, defaultSeconds) {
    for (let seconds = STEP_SECONDS; seconds <= maxSeconds; seconds += STEP_SECONDS) {
      const option = document.createElement('option');
      option.value = seconds;
      option.textContent = formatTime(seconds);
      select.appendChild(option);
    }
    select.value = defaultSeconds;
  }

  populateTimeSelect(focusSelect, FOCUS_MAX_SECONDS, 25 * 60);
  populateTimeSelect(breakSelect, BREAK_MAX_SECONDS, 5 * 60);

  let FOCUS_TIME = Number(focusSelect.value); // 集中時間（秒）
  let BREAK_TIME = Number(breakSelect.value); // 休憩時間（秒）

  let remainingSeconds = FOCUS_TIME;
  let isFocusMode = true;
  let isRunning = false;
  let timerId = null;
  let completedSets = 0;
  let alarmIntervalId = null;
  let audioCtx = null;

  const timeDisplay = document.getElementById('timeDisplay');
  const modeLabel = document.getElementById('modeLabel');
  const cycleCount = document.getElementById('cycleCount');
  const startStopBtn = document.getElementById('startStopBtn');
  const resetBtn = document.getElementById('resetBtn');
  const alarmStopBtn = document.getElementById('alarmStopBtn');

  function updateDisplay() {
    timeDisplay.textContent = formatTime(remainingSeconds);
    modeLabel.textContent = isFocusMode ? '集中モード' : '休憩モード';
    modeLabel.classList.toggle('break', !isFocusMode);
    document.body.classList.toggle('break-mode', !isFocusMode);
    document.title = `${formatTime(remainingSeconds)} - ${isFocusMode ? '集中中' : '休憩中'}`;
    cycleCount.textContent = `完了したセット: ${completedSets}`;
  }

  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playBellOnce() {
    // Web Audio APIでベル音を鳴らす（外部ファイル不要）
    try {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      // 2回のビープでベルらしい音にする
      [0, 0.35].forEach((offset) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.3, now + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.3);
      });
    } catch (e) {
      console.warn('音声の再生に失敗しました', e);
    }
  }

  function startAlarm() {
    stopAlarm(); // 念のため既存のアラームをクリアしてから開始
    playBellOnce();
    alarmIntervalId = setInterval(playBellOnce, 1200);
    alarmStopBtn.disabled = false;
    alarmStopBtn.classList.add('ringing');
  }

  function stopAlarm() {
    if (alarmIntervalId) {
      clearInterval(alarmIntervalId);
      alarmIntervalId = null;
    }
    alarmStopBtn.disabled = true;
    alarmStopBtn.classList.remove('ringing');
  }

  function switchMode() {
    if (isFocusMode) {
      // 集中モード終了 → ベルを鳴らして休憩モードへ
      startAlarm();
      completedSets++;
      isFocusMode = false;
      remainingSeconds = BREAK_TIME;
    } else {
      // 休憩モード終了 → 集中モードへ
      isFocusMode = true;
      remainingSeconds = FOCUS_TIME;
    }
    updateDisplay();
  }

  function tick() {
    if (remainingSeconds > 0) {
      remainingSeconds--;
      updateDisplay();
    } else {
      switchMode();
    }
  }

  function start() {
    if (isRunning) return;
    isRunning = true;
    startStopBtn.textContent = '停止';
    focusSelect.disabled = true;
    breakSelect.disabled = true;
    timerId = setInterval(tick, 1000);
  }

  function stop() {
    if (!isRunning) return;
    isRunning = false;
    startStopBtn.textContent = '開始';
    focusSelect.disabled = false;
    breakSelect.disabled = false;
    clearInterval(timerId);
    timerId = null;
  }

  function reset() {
    stop();
    stopAlarm();
    isFocusMode = true;
    remainingSeconds = FOCUS_TIME;
    completedSets = 0;
    updateDisplay();
  }

  focusSelect.addEventListener('change', () => {
    FOCUS_TIME = Number(focusSelect.value);
    if (isFocusMode && !isRunning) {
      remainingSeconds = FOCUS_TIME;
      updateDisplay();
    }
  });

  breakSelect.addEventListener('change', () => {
    BREAK_TIME = Number(breakSelect.value);
    if (!isFocusMode && !isRunning) {
      remainingSeconds = BREAK_TIME;
      updateDisplay();
    }
  });

  startStopBtn.addEventListener('click', () => {
    if (isRunning) {
      stop();
    } else {
      start();
    }
  });

  resetBtn.addEventListener('click', reset);
  alarmStopBtn.addEventListener('click', stopAlarm);

  updateDisplay();
</script>

</body>
</html>
